name: Speed Lab measurements

on:
  push:
    branches: [main, sub-8-speed-lab-demo-page-playwright-timing-budgets]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v3
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Build docs site
        run: pnpm --filter www build

      - name: Run speed-lab tests
        run: pnpm exec playwright test tests/speed-lab/
        env:
          CI: true

      - name: Check for results changes
        id: changes
        run: |
          if git diff --quiet apps/www/lib/speed-lab-results.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit results
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/www/lib/speed-lab-results.json
          git commit -m "chore: update speed-lab measurements [skip ci]"
          git push

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 14
